<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .container {
            background: white;
            color: black;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            margin: auto;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
            text-align: left;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        label {
            font-weight: bold;
        }
        .flash-error {
            color: #dc3545;
            margin-bottom: 10px;
        }
        .flash-info {
            color: #007bff;
            margin-bottom: 10px;
        }
        .flash-warning {
            color: #ffc107;
            margin-bottom: 10px;
        }
        .flash-success {
            color: #28a745;
            margin-bottom: 10px;
        }
        a {
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required autofocus>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>

        <button type="submit">Log In</button>
    </form>

    <p style="text-align: center; margin-top: 15px;">New user? <a href="/register">Register</a></p>
</div>

</body>
</html>
