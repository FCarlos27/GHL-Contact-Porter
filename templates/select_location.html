<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Location</title>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .container {
            background: white;
            color: black;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            margin: auto;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
            text-align: left;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Select a Location</h2>

    <form method="POST">
        <label for="location_id">Location:</label>
        <select name="location_id" id="location_id" required>
            {% for loc in locations %}
                <option value="{{ loc.id }}">{{ loc.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Continue</button>
    </form>
</div>

</body>
</html>
